name: Accuracy & Latency Canary

on:
  schedule:
    # Run once daily at 12:00 AM midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  canary-check:
    name: Run OCR Canary SLA Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Client Dependencies
        run: pip install httpx

      - name: Run Canary Check
        env:
          BASE_URL: ${{ secrets.API_BASE_URL }}
          HF_SPACE_STAGING: ${{ secrets.HF_SPACE_STAGING }}
          HF_SPACE_PRODUCTION: ${{ secrets.HF_SPACE_PRODUCTION }}
          INTERNAL_KEY: ${{ secrets.INTERNAL_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          TARGET_URL="${BASE_URL}"
          if [ -z "$TARGET_URL" ]; then
            if [ "${{ matrix.environment }}" = "staging" ]; then
              CLEAN_NAME=$(echo "$HF_SPACE_STAGING" | tr '/' '-' | tr '_' '-')
            else
              CLEAN_NAME=$(echo "$HF_SPACE_PRODUCTION" | tr '/' '-' | tr '_' '-')
            fi
            if [ -n "$CLEAN_NAME" ]; then
              TARGET_URL="https://${CLEAN_NAME}.hf.space"
            fi
          fi

          if [ -z "$TARGET_URL" ]; then
            echo "[CANARY] WARNING: Neither API_BASE_URL nor HF_SPACE_${{ matrix.environment }} secret is configured. Skipping canary check."
            exit 0
          fi
          echo "Target Canary URL: $TARGET_URL"
          python scripts/canary.py \
            --base-url "$TARGET_URL" \
            --api-key "$INTERNAL_KEY" \
            --fixture tests/fixtures/golden_fixture.pdf \
            --truth tests/fixtures/golden_fixture_truth.txt \
            --max-latency 4.0 \
            --max-e2e-latency 30.0 \
            --max-cer 0.03
