[project]
name = "obliq-api"
version = "0.1.0"
description = "HTTP OCR service wrapping obliq-ocr (PyMuPDF + RapidOCR/ONNX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "obliq-ocr>=0.1.3",
    "fastapi[standard]>=0.115.0,<0.120",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.16",
    "redis>=5.2,<6",
    "python-multipart>=0.0.12,<0.1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4.2,<5",
    "httpx>=0.28,<0.29",
    "structlog>=24.4,<27",
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<0.52",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<0.52",
    "opentelemetry-instrumentation-redis>=0.49b0,<0.52",
    "opentelemetry-exporter-otlp>=1.28,<2",
    "uvicorn[standard]>=0.32,<0.35",
    "orjson>=3.10,<4",
    "aiofiles>=24.1,<25",
    "email-validator>=2.2,<3",
    "psycopg2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.10",
    "mypy>=1.13,<1.15",
    "fakeredis[lua]>=2.26,<3",
    "locust>=2.31,<3",
]

[project.scripts]
obliq-api = "obliq_api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obliq_api"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
